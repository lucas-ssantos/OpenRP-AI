<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenRP AI — Personagens</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <link rel="stylesheet" href="/assets/css/sidebar.css" />
    <link rel="stylesheet" href="/assets/css/index.css" />
  </head>
  <body>
    <div class="d-flex min-vh-100">
      <div id="sidebar-root" class="flex-shrink-0"></div>

      <div class="flex-grow-1 overflow-auto">
        <main class="content-main p-3 p-md-4">

          <div class="mb-4">
            <h1 class="fw-bold mb-1" style="font-size:clamp(1.8rem,3vw,2.5rem); letter-spacing:-0.04em;">Personagens</h1>
            <p class="text-secondary mb-0">Selecione um personagem para conversar ou adicione um novo à sua coleção.</p>
          </div>

          <div id="page-error" class="alert-glass-error mb-4" role="status" style="display:none;"></div>

          <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4" id="character-grid">

            <!-- Add card (static) -->
            <div class="col">
              <div class="card glass-card add-card h-100 d-flex flex-column align-items-center justify-content-center text-center p-4"
                   role="button" onclick="addCharacter()">
                <div class="add-icon mb-3">+</div>
                <h5 class="mb-1 fw-semibold" style="color:#38bdf8;">Novo personagem</h5>
                <p class="text-secondary small mb-0">Crie um personagem para começar o roleplay.</p>
              </div>
            </div>

          </div>
        </main>
      </div>
    </div>

    <!-- ── Delete: passo 1 (aviso) ───────────────────────────────────── -->
    <div class="modal fade" id="deleteStep1Modal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered" style="max-width:380px;">
        <div class="modal-content" style="background:rgba(6,12,30,0.98); border:1px solid rgba(148,163,184,0.15); border-radius:1.1rem;">
          <div class="modal-header" style="border-bottom:1px solid rgba(148,163,184,0.1); padding:1.1rem 1.25rem .85rem;">
            <h6 class="modal-title mb-0" id="delete-step1-title" style="color:#f1f5f9; font-weight:700; font-size:.95rem;">
              <i class="bi bi-trash3 me-2" style="color:#f87171;"></i>Apagar personagem
            </h6>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" style="font-size:.8rem;"></button>
          </div>
          <div class="modal-body" style="color:#94a3b8; font-size:.88rem; line-height:1.65; padding:1.1rem 1.25rem;">
            <p class="mb-0" id="delete-step1-body"></p>
          </div>
          <div class="modal-footer" style="border-top:1px solid rgba(148,163,184,0.1); padding:.85rem 1.25rem; gap:.5rem;">
            <button type="button" data-bs-dismiss="modal"
                    style="background:rgba(30,41,59,.7); border:1px solid rgba(148,163,184,.2); color:#cbd5e1; border-radius:.75rem; padding:.35rem .9rem; font-size:.85rem; cursor:pointer;">
              Cancelar
            </button>
            <button type="button" id="delete-step1-confirm"
                    style="background:rgba(239,68,68,.18); border:1px solid rgba(239,68,68,.4); color:#fca5a5; border-radius:.75rem; padding:.35rem .9rem; font-size:.85rem; cursor:pointer;">
              Continuar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ── Delete: passo 2 (confirmação final) ──────────────────────── -->
    <div class="modal fade" id="deleteStep2Modal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered" style="max-width:380px;">
        <div class="modal-content" style="background:rgba(6,12,30,0.98); border:1px solid rgba(239,68,68,0.3); border-radius:1.1rem;">
          <div class="modal-header" style="border-bottom:1px solid rgba(148,163,184,0.1); padding:1.1rem 1.25rem .85rem;">
            <h6 class="modal-title mb-0" style="color:#f1f5f9; font-weight:700; font-size:.95rem;">
              <i class="bi bi-exclamation-triangle-fill me-2" style="color:#f87171;"></i>Tem certeza mesmo?
            </h6>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" style="font-size:.8rem;"></button>
          </div>
          <div class="modal-body" style="color:#94a3b8; font-size:.88rem; line-height:1.65; padding:1.1rem 1.25rem;">
            <p class="mb-0">
              Confirme mais uma vez: deseja apagar <strong id="delete-step2-target" style="color:#fca5a5;"></strong>?
              Esta ação é <strong style="color:#f87171;">irreversível</strong>.
            </p>
          </div>
          <div class="modal-footer" style="border-top:1px solid rgba(148,163,184,0.1); padding:.85rem 1.25rem; gap:.5rem;">
            <button type="button" data-bs-dismiss="modal"
                    style="background:rgba(30,41,59,.7); border:1px solid rgba(148,163,184,.2); color:#cbd5e1; border-radius:.75rem; padding:.35rem .9rem; font-size:.85rem; cursor:pointer;">
              Cancelar
            </button>
            <button type="button" id="delete-step2-confirm"
                    style="background:rgba(239,68,68,.9); border:1px solid rgba(239,68,68,.9); color:#fff; border-radius:.75rem; padding:.35rem .9rem; font-size:.85rem; cursor:pointer;">
              <i class="bi bi-trash3 me-1"></i>Sim, apagar definitivamente
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/sidebar.js"></script>
    <script src="/assets/js/index.js"></script>
  </body>
</html>
